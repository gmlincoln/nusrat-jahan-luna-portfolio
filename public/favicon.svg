<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#0E1C36"/>
  <!-- Molecular node connections -->
  <line x1="30" y1="50" x2="50" y2="30" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="30" x2="70" y2="50" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="70" x2="30" y2="50" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="70" x2="70" y2="50" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="30" cy="50" r="9" fill="#3B82F6"/>
  <circle cx="50" cy="30" r="9" fill="#6366F1"/>
  <circle cx="70" cy="50" r="9" fill="#0D9488"/>
  <circle cx="50" cy="70" r="9" fill="#38BDF8"/>
  <circle cx="50" cy="50" r="6" fill="#FFFFFF"/>
</svg>
